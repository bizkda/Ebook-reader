name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - run: cargo tauri build

      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - run: cargo tauri build --target universal-apple-darwin

      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build
        run: cargo tauri build
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Debug bundle output
        run: |
          find . -path ./node_modules -prune -o -type d -name bundle -print
          find . -path ./node_modules -prune -o \( -name "*.AppImage" -o -name "*.deb" \) -print
          ls -la ~/.cache/tauri || true

      - name: Fix AppImage permissions
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE_PATH=$(find . -path ./node_modules -prune -o -name "*.AppImage" -print | head -n 1)
          test -n "$APPIMAGE_PATH" || { echo "No AppImage found"; exit 1; }
          cd "$(dirname "$APPIMAGE_PATH")"
          APPIMAGE=$(basename "$APPIMAGE_PATH")

          TOOL=~/.cache/tauri/appimagetool-x86_64.AppImage
          if [ ! -x "$TOOL" ]; then
            mkdir -p ~/.cache/tauri
            wget -q -O "$TOOL" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x "$TOOL"
          fi

          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract
          chmod -R a+rX squashfs-root
          chmod a+x squashfs-root/AppRun*
          ARCH=x86_64 "$TOOL" squashfs-root "$APPIMAGE"
          rm -rf squashfs-root

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            **/release/bundle/deb/*.deb
            **/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}