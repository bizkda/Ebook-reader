<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Open book app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7459E2"/>
      <stop offset="1" stop-color="#5A42C8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F66B40"/>
      <stop offset="1" stop-color="#E24E26"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7653A"/>
      <stop offset="1" stop-color="#EA512A"/>
    </linearGradient>
    <linearGradient id="shadeL" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="512" y2="0">
      <stop offset="0" stop-color="#E6CFA9" stop-opacity="0"/>
      <stop offset="1" stop-color="#E6CFA9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="shadeR" gradientUnits="userSpaceOnUse" x1="724" y1="0" x2="512" y2="0">
      <stop offset="0" stop-color="#E6CFA9" stop-opacity="0"/>
      <stop offset="1" stop-color="#E6CFA9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="232"/></clipPath>
    <clipPath id="clipR"><path d="M512 335C584 272 724 205 828 212Q864 215 866 252L866 640Q866 672 832 678C712 692 584 738 512 800Z"/></clipPath>
    <path id="leaf" d="M0 0 C26 -24 74 -24 100 0 C74 24 26 24 0 0 Z"/>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- orange base -->
    <path d="M146 742 C300 758 430 826 512 880 C594 826 724 758 878 742 Q902 740 902 766 L898 842 Q896 872 866 874 C730 884 604 930 512 972 C420 930 294 884 158 874 Q128 872 126 842 L122 766 Q122 740 146 742 Z" fill="url(#orange)"/>

    <!-- soft shadow under the book -->
    <g filter="url(#blur)" opacity="0.38" transform="translate(0 30)">
      <path d="M512 335 C440 272 300 205 196 212 Q160 215 158 252 L158 640 Q158 672 192 678 C312 692 440 738 512 800 Z" fill="#2B1A78"/>
      <path d="M512 335C584 272 724 205 828 212Q864 215 866 252L866 640Q866 672 832 678C712 692 584 738 512 800Z" fill="#2B1A78"/>
    </g>

    <!-- page stack (thickness) -->
    <path d="M512 400 L170 250 L136 262 L136 660 Q136 696 172 702 C300 716 436 760 512 822 Z" fill="#E3CDA9"/>
    <path d="M512 400L854 250L888 262L888 660Q888 696 852 702C724 716 588 760 512 822Z" fill="#E3CDA9"/>
    <path d="M512 400 L170 250 L147 256 L147 650 Q147 686 182 692 C306 704 438 750 512 811 Z" fill="#EEDCC0"/>
    <path d="M512 400L854 250L877 256L877 650Q877 686 842 692C718 704 586 750 512 811Z" fill="#EEDCC0"/>

    <!-- pages -->
    <path d="M512 335 C440 272 300 205 196 212 Q160 215 158 252 L158 640 Q158 672 192 678 C312 692 440 738 512 800 Z" fill="#FEF6E8"/>
    <path d="M512 335 C440 272 300 205 196 212 Q160 215 158 252 L158 640 Q158 672 192 678 C312 692 440 738 512 800 Z" fill="url(#shadeL)"/>
    <path d="M512 335C584 272 724 205 828 212Q864 215 866 252L866 640Q866 672 832 678C712 692 584 738 512 800Z" fill="#FEF6E8"/>
    <path d="M512 335C584 272 724 205 828 212Q864 215 866 252L866 640Q866 672 832 678C712 692 584 738 512 800Z" fill="url(#shadeR)"/>

    <!-- bookmark (clipped to the right page) -->
    <g clip-path="url(#clipR)">
      <path d="M628 150 L722 150 L722 470 L675 430 L628 470 Z" fill="url(#ribbon)"/>
    </g>

    <!-- sprig -->
    <g fill="#D9C4A5" opacity="0.95">
      <path d="M268 625 C272 520 300 440 338 352" fill="none" stroke="#D9C4A5" stroke-width="9" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(272.4 570.5) rotate(-134.8) scale(1.0)"/>
    <use href="#leaf" transform="translate(272.4 570.5) rotate(-30.8) scale(1.0)"/>
    <use href="#leaf" transform="translate(282.2 514.3) rotate(-129.4) scale(0.94)"/>
    <use href="#leaf" transform="translate(282.2 514.3) rotate(-25.4) scale(0.94)"/>
    <use href="#leaf" transform="translate(296.4 461.1) rotate(-124.7) scale(0.84)"/>
    <use href="#leaf" transform="translate(296.4 461.1) rotate(-20.7) scale(0.84)"/>
    <use href="#leaf" transform="translate(314.5 409.3) rotate(-121.1) scale(0.72)"/>
    <use href="#leaf" transform="translate(314.5 409.3) rotate(-17.1) scale(0.72)"/>
    <use href="#leaf" transform="translate(338.0 352.0) rotate(-66.6) scale(0.7)"/>
    </g>
  </g>
</svg>
